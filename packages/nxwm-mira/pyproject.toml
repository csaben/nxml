[project]
name = "nxwm-mira"
version = "0.1.0"
description = "MIRA RAEv2 codec port: representation-autoencoder training for Nintendo Switch world models"
requires-python = ">=3.14"
authors = [{ name = "Clark Saben" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "nxml-core",
    "torch>=2.10",
    "torchvision>=0.25",
    "numpy>=1.26",
    "einops>=0.8",
    "pyyaml>=6",
    "pydantic>=2.7",
    "click>=8.1",
    "pillow>=10",
    "torchcodec>=0.4",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tqdm>=4",
    # Transitive deps of the facebookresearch/dinov3 torch.hub repo code (imported when
    # building the frozen backbone); torchmetrics doubles as the LPIPS fallback.
    "torchmetrics>=1.4",
    "termcolor>=2",
]

[project.optional-dependencies]
training = [
    "wandb>=0.18",
    "python-dotenv>=1",
    "lpips>=0.1.4",
]
# Latent correlation/std plotly diagnostics (run.latent_diagnostics).
viz = [
    "plotly>=5",
]
# `nxwm-mira play`: reuses nxwm's gamepad browser UI (and its cv2 JPEG encode).
play = [
    "nxwm",
    "opencv-python>=4.10.0",
]

[project.urls]
Repository = "https://github.com/csaben/nxml"
Issues = "https://github.com/csaben/nxml/issues"

[project.scripts]
nxwm-mira = "nxwm_mira.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxwm_mira"]

[tool.uv.sources]
nxml-core = { workspace = true }
nxwm = { workspace = true }
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
