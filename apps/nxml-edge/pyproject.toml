[project]
name = "nxml-edge"
version = "0.1.0"
description = "Always-on NXML edge supervisor for capture, Bluetooth, policy, and autopilot"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.30",
    "opencv-python>=4.9",
]

[project.scripts]
nxml-edge = "nxml_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxml_edge"]

[tool.hatch.build.targets.wheel.force-include]
"src/nxml_edge/static/index.html" = "nxml_edge/static/index.html"
